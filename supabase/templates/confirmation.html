<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:#111; max-width:560px; margin:0 auto; padding:32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid #eee; width:100%;">
    <tr>
      <!-- Kept in step with header() in supabase/functions/send-email/templates/_shared.ts.
           Pre-cropped registered wordmark, so no clipping hack; black glyphs on
           opaque white, since the white-on-transparent variant would vanish on a
           mail body. -->
      <td style="line-height:0;">
        <img src="{{ .SiteURL }}/images/wordmark-reg-email.png" alt="zarketplace" width="172" height="32" style="display:block; width:172px; height:32px;" />
      </td>
    </tr>
  </table>

  <h1 style="font-weight:900; text-transform:uppercase; letter-spacing:-1px;">Confirm your email</h1>

  <p>Hi,</p>
  <p>Confirm your email to finish setting up your zarketplace account.</p>

  <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#000; color:#fff; padding:14px 24px; text-decoration:none; font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:11px; margin:12px 0 20px;">Confirm email</a>

  <p style="color:#666; font-size:13px;">This link expires in 1 hour. If you didn't create a zarketplace account, you can ignore this email.</p>
</div>
