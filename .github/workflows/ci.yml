# The vendor-email assertion is the reason this file exists.
#
# A vendor never seeing the resale price, the spread, or any sign that a buyer
# exists is the legal basis of the model. That cannot rest on someone noticing
# a bad string in a diff, so it runs on every push and blocks the merge.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  leak-assertions:
    name: Nothing leaks a vendor to a buyer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Render every vendor email with a poisoned payload
        run: deno test supabase/functions/dispatch-vendor-emails/templates.test.ts
      - name: No outbound shipping payload carries a vendor address
        run: deno test supabase/functions/shiprocket-book-leg/payload.test.ts
      - name: No buyer email leaks a vendor
        run: deno test supabase/functions/send-email/templates/buyer.test.ts
      - name: Nothing the live API serves leaks a vendor or a buyer
        env:
          TEST_VENDOR_EMAIL: ${{ secrets.TEST_VENDOR_EMAIL }}
          TEST_VENDOR_PASSWORD: ${{ secrets.TEST_VENDOR_PASSWORD }}
        run: deno test --allow-net --allow-env --allow-read tests/isolation.test.ts

  typecheck-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Contrast is a property of the rendered page, not of the source: the
      # class that shipped three invisible paragraphs was correct in isolation
      # and only failed against the ground it landed on. So this boots the
      # built app in a real browser and measures composited pixels.
      - run: npx playwright install --with-deps chromium
      - name: Nothing user-facing renders below WCAG AA
        run: |
          npx vite preview --port 4173 &
          npx wait-on -t 60000 http://localhost:4173
          npm run test:contrast
