<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The name, then what it is, in the words people search with: on its
         own "zarketplace" reads as a typo for "marketplace". Mirrored in
         src/lib/pageMeta.ts (DEFAULT_TITLE, DEFAULT_DESCRIPTION). -->
    <title>zarketplace | Pre-owned &amp; thrift clothing in India</title>
    <meta name="description" content="Pre-owned and thrift clothing in India, sold and shipped by zarketplace. Every piece checked, priced upfront and delivered free. Sell us yours for a fixed offer." />
    <meta name="application-name" content="zarketplace" />
    <link rel="canonical" href="https://www.zarketplace.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <!-- The home banner is the first thing on the page and the largest thing we
         serve, so it starts downloading with the HTML rather than waiting for
         the CSS that references it. -->
    <link rel="preload" as="image" href="/images/banner-3-new.jpg" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zarketplace" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="zarketplace | Pre-owned &amp; thrift clothing in India" />
    <meta property="og:description" content="Pre-owned and thrift clothing in India, sold and shipped by zarketplace. Every piece checked, priced upfront and delivered free. Sell us yours for a fixed offer." />
    <meta property="og:url" content="https://www.zarketplace.com/" />
    <!-- The hero photograph, letterboxed to 1200x630 on the same black the
         hero sits on. The wordmark used to be here, which previewed every
         shared link as a logo on a plain field and told a stranger nothing
         about what the site is. Dimensions are declared because WhatsApp and
         Facebook lay out the card before the image finishes downloading. -->
    <meta property="og:image" content="https://www.zarketplace.com/images/og-hero.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="zarketplace, pre-owned and thrift clothing in India" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="zarketplace | Pre-owned &amp; thrift clothing in India" />
    <meta name="twitter:description" content="Pre-owned and thrift clothing in India, sold and shipped by zarketplace. Every piece checked, priced upfront and delivered free. Sell us yours for a fixed offer." />
    <meta name="twitter:image" content="https://www.zarketplace.com/images/og-hero.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">

    <!-- Fonts loaded directly in <head> (not via CSS @import) so the browser
         starts fetching them immediately, in parallel with everything else,
         instead of waiting for JS to inject the stylesheet. Minimizes the
         visible font-swap reflow on first load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Critical inline styles so the page never paints as unstyled HTML
         while the rest of the stylesheet loads. -->
    <style>
      /* Black behind the page, to match the footer: iOS Safari tints the bar
         under its floating address pill with this colour, and white put a
         white strip below the footer. The app itself paints white on #root. */
      html, body { margin: 0; background: #000; }
      #root { background: #fff; min-height: 100vh; min-height: 100dvh; }
      html { scrollbar-gutter: stable; }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>

    <!-- Structured data. There was none, which for this business is the single
         biggest thing Google could not work out on its own: whether it is
         looking at a marketplace or at a shop. OnlineStore, with one named
         legal entity as the seller, says shop. The Product schema injected on
         each item page in api/item.ts says the same thing per listing.

         WebSite is what Google reads for the site name it shows above a
         result: without it, "zarketplace" is a word it may take for a typo. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "OnlineStore",
          "@id": "https://www.zarketplace.com/#organisation",
          "name": "zarketplace",
          "alternateName": "zarketplace.com",
          "legalName": "ADNIZ Private Limited",
          "url": "https://www.zarketplace.com/",
          "logo": "https://www.zarketplace.com/images/registered-wordmark/zark-reg-tp.png",
          "image": "https://www.zarketplace.com/images/og-hero.jpg",
          "description": "zarketplace is an Indian resale company for pre-owned and thrift clothing. It buys clothes from individuals at a fixed offer, checks every piece at its own hub, and sells them in its own name at a fixed price, with free delivery and Buyer Protection. It is a shop, not a marketplace: every item is sold and shipped by zarketplace.",
          "knowsAbout": ["Pre-owned clothing", "Thrift fashion", "Clothing resale", "Circular fashion"],
          "identifier": [
            { "@type": "PropertyValue", "name": "CIN", "value": "U47711DL2023PTC418107" }
          ],
          "address": { "@type": "PostalAddress", "addressCountry": "IN", "addressRegion": "Delhi" },
          "areaServed": { "@type": "Country", "name": "India" },
          "contactPoint": [{
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "contact@zarketplace.com",
            "telephone": "+91-85059-27538",
            "availableLanguage": ["en", "hi"]
          }],
          "sameAs": [
            "https://www.instagram.com/zarketplace",
            "https://x.com/zarketplace",
            "https://www.youtube.com/@zarketplace"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.zarketplace.com/#website",
          "url": "https://www.zarketplace.com/",
          "name": "zarketplace",
          "alternateName": ["zarketplace.com"],
          "description": "Pre-owned and thrift clothing in India, sold and shipped by zarketplace.",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://www.zarketplace.com/#organisation" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Static hero. The app is client-rendered, so nothing painted until the
         JS bundle had downloaded, parsed and executed: the largest element was
         a React component and LCP sat at 9.1s while FCP was 3.8s. Blocking
         every listing photo did not move it, which is what identified the
         render chain rather than image bytes as the cause.

         This is the same markup and the same Tailwind classes as HeroBanner in
         src/pages/Marketplace.tsx, emitted in the first response. The
         stylesheet loads in parallel with the bundle, so it paints without
         waiting for React. HeroBanner removes this node in a layout effect the
         moment it mounts - before the browser paints, so there is never two of
         them and never a gap.

         Keep the two in sync: if the hero changes, change it in both. The
         heights must match or swapping one for the other is a layout shift. -->
    <!--static-hero:start-->
    <div id="static-hero" class="pt-20 bg-black">
      <section class="relative isolate overflow-hidden bg-black text-white">
        <div aria-hidden="true" class="absolute inset-y-0 right-0 w-[68%] sm:hidden">
          <div class="absolute inset-0 bg-cover bg-no-repeat" style="background-image:url(/images/banner-3-new.jpg);background-position:14% center"></div>
          <div class="absolute inset-0 bg-gradient-to-r from-black via-black/55 to-black/10"></div>
        </div>
        <div aria-hidden="true" class="hidden sm:block absolute inset-y-0 right-0 w-[64%]">
          <div class="absolute inset-0 bg-cover bg-no-repeat bg-center" style="background-image:url(/images/banner-3-new.jpg)"></div>
          <div class="absolute inset-0 bg-gradient-to-r from-black via-black/45 via-35% to-transparent to-75%"></div>
        </div>
        <div class="relative mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-8 py-14 sm:py-20 lg:py-24 flex flex-col items-start gap-6 sm:gap-8">
          <h1 class="text-[2.35rem] leading-[0.9] sm:text-6xl lg:text-7xl font-black uppercase tracking-tighter">
            <span class="block">Rest in peace,</span>
            <span class="block">DM for price.</span>
          </h1>
          <p class="max-w-[34ch] text-sm sm:text-base font-medium leading-relaxed">
            Pre-owned fashion, sold and shipped by us. Every price upfront, every piece checked.
          </p>
          <div class="flex flex-wrap gap-3">
            <a href="#shop" class="bg-white px-8 py-4 text-[11px] font-black uppercase tracking-[0.2em] text-black">Shop now</a>
            <a href="/sell" class="border border-white px-8 py-4 text-[11px] font-black uppercase tracking-[0.2em] text-white">Get an offer</a>
          </div>
        </div>
      </section>
    </div>
    <script>
      // The shell is served for every route, including /item/* through the
      // meta-injection function, so anything that is not the feed drops the
      // hero before it can be painted. Inline and immediately after the node,
      // so it runs in the same parse - there is no flash to remove.
      (function () {
        var p = location.pathname;
        if (p !== '/' && p !== '/browse') {
          var el = document.getElementById('static-hero');
          if (el) el.remove();
        }
      })();
    </script>
    <!--static-hero:end-->
    <!-- What the site is, in plain HTML, for anything that reads this page
         without running the app: the AI crawlers behind ChatGPT, Claude and
         Perplexity do not run JavaScript. A browser running the app never
         shows it. api/page.ts and api/item.ts swap in each page's own summary
         between the markers. Every sentence must stay true. -->
    <!--seo:start--><noscript><h2>zarketplace: pre-owned and thrift clothing in India</h2><p>zarketplace is a resale company. We buy pre-owned clothing from individuals and sell it in our own name, so every item is sold and shipped by zarketplace, at a fixed price shown on the listing. There is no haggling and no DM for price.</p><p>Every item comes to our hub, is checked against its listing and photos, and is repacked before it ships to you, tracked. Delivery is free, and Buyer Protection covers every order: if an item arrives not as described or is the wrong item, tell us within 7 days of delivery for a full refund.</p><p>Selling to us: add photos and details of an item, and within 24 hours we make you an offer, a fixed amount in rupees. Accept it and the item goes on sale while it stays with you. When someone buys it, we send a prepaid label, a courier collects it from your door, and we pay you once it reaches our hub and has been checked.</p><ul><li><a href="/sell">Get an offer</a></li><li><a href="/how-it-works">How selling works</a></li><li><a href="/buyer-protection">Buyer Protection</a></li><li><a href="/returns">Returns and refunds</a></li><li><a href="/shipping-policy">Shipping</a></li><li><a href="/conditions-guide">Conditions guide</a></li><li><a href="/faq">FAQ</a></li><li><a href="/about">About zarketplace</a></li><li><a href="/our-mission">Our mission</a></li><li><a href="/contact">Contact us</a></li></ul></noscript><!--seo:end-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
